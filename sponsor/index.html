<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赞助 PaperKito · Sponsor PaperKito</title>
<meta name="description" content="如果我的某个项目帮到了你，可以请我喝杯咖啡。支持爱发电、支付宝、微信。">
<style>
  :root {
    --bg: #FBFAFE;
    --surface: #FFFFFF;
    --text: #1A1729;
    --muted: #6E6A85;
    --line: #E8E5F2;
    --accent: #5F52D6;
    --accent-hover: #523FB8;
    --tint: #F3F1FC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12111A;
      --surface: #1B1926;
      --text: #EDEAF6;
      --muted: #9C97B4;
      --line: #2C2938;
      --accent: #7F77DD;
      --accent-hover: #8F88E6;
      --tint: #221F31;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 72px 24px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 600px; margin: 0 auto; }

  .mark { width: 44px; height: 44px; display: block; margin-bottom: 26px; }
  .mark path { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }

  h1 {
    font-size: 31px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.25;
    margin: 0 0 10px;
  }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 40px; }

  .region {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin: 0 0 16px;
  }
  .region::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .btn {
    display: block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    text-align: center;
    padding: 17px 20px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: background .16s ease, transform .16s ease;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn small {
    display: block;
    margin-top: 3px;
    font-size: 12.5px;
    font-weight: 400;
    opacity: .82;
    letter-spacing: 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 30px 0 26px;
    color: var(--muted);
    font-size: 12.5px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .label {
    font-size: 12px;
    letter-spacing: 0.09em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .qrs { display: flex; gap: 18px; }
  .qr {
    flex: 1 1 0;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 15px;
    text-align: center;
  }
  .qr .slot {
    background: #FFFFFF;
    border-radius: 11px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .qr .slot .missing { color: #8A8A96; font-size: 12px; }
  .qr .cap { margin-top: 13px; font-size: 14px; font-weight: 600; }
  .qr .cap span {
    display: block;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .terms {
    margin: 32px 0 0;
    padding: 0;
    color: var(--muted);
    font-size: 13px;
  }

  footer {
    margin-top: 40px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    body { padding: 48px 18px 60px; }
    h1 { font-size: 26px; }
    .qrs { flex-direction: column; }
  }
</style>
</head>
<body>
<main>

  <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
    <path d="M6 31 C 14 9, 30 9, 38 27" />
    <path d="M11 34 C 17 18, 27 18, 33 31" opacity=".38" />
  </svg>

  <h1>赞助 PaperKito</h1>
  <p class="sub">如果我的某个项目帮到了你，可以请我喝杯咖啡。</p>

  <div class="region">中国</div>

  <a class="btn" href="https://afdian.com/a/PaperKito">
    前往爱发电
    <small>支付宝 / 微信，可包月或自选金额</small>
  </a>

  <div class="divider">或</div>

  <p class="label">扫码赞助</p>
  <div class="qrs">
    <div class="qr">
      <div class="slot">
        <img src="alipay.png" alt="支付宝收款码" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=&quot;missing&quot;>alipay.png 未放置</span>';">
      </div>
      <div class="cap">支付宝<span>ALIPAY</span></div>
    </div>
    <div class="qr">
      <div class="slot">
        <img src="wechat.png" alt="微信赞赏码" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=&quot;missing&quot;>wechat.png 未放置</span>';">
      </div>
      <div class="cap">微信赞赏<span>WECHAT</span></div>
    </div>
  </div>

  <p class="terms">赞助完全自愿，不解锁任何功能，也不带来优先支持或内测版本。</p>

  <footer>
    <a href="https://github.com/PaperKito">github.com/PaperKito</a>
  </footer>

</main>
</body>
</html>
